# Pings production every 15 minutes. A failed run emails the repository
# owner (GitHub's default for failed scheduled workflows), so downtime is
# noticed even when no one is using the app.
#
# Cloudflare bot protection 403s datacenter IPs (GitHub runners). A request
# carrying the UPTIME_KEY secret header is our monitor — expect 200 once a
# WAF skip rule for that header exists in the Cloudflare dashboard; until
# then a 403 challenge is logged as a warning, not a failure. Real failures
# are 5xx, other codes, or timeouts.
#
# Note: GitHub auto-disables scheduled workflows after 60 days without repo
# activity — normal development activity keeps this alive.

name: Uptime check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: uptime-check
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Landing page responds
        env:
          UPTIME_KEY: ${{ secrets.UPTIME_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -H "x-uptime-key: $UPTIME_KEY" "https://tapme.nimfi.dev/?uptime=$(date +%s)")
          echo "HTTP $code"
          case "$code" in
            200) exit 0 ;;
            403) echo "WARN: bot challenge (add WAF skip rule for x-uptime-key)"; exit 0 ;;
            *) echo "FAIL: unexpected response"; exit 1 ;;
          esac

      - name: Login page responds
        env:
          UPTIME_KEY: ${{ secrets.UPTIME_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -H "x-uptime-key: $UPTIME_KEY" "https://tapme.nimfi.dev/login")
          echo "HTTP $code"
          case "$code" in
            200) exit 0 ;;
            403) echo "WARN: bot challenge (add WAF skip rule for x-uptime-key)"; exit 0 ;;
            *) echo "FAIL: unexpected response"; exit 1 ;;
          esac
